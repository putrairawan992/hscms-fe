run-name: ${{ github.actor }} is deploying out Staging HCMS FE🚀

on:
  push:
    branches:
      - staging

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: checkout
    outputs:
      DEV_VERSION: ${{ steps.set_dev_version.outputs.dev_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Create .env file from secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_STAGING }}
        run: |
          echo "$ENV_CONTENT" > .env
          cat .env
          
      - name: Determine Staging Version
        id: set_dev_version
        run: |
          echo "Fetching existing versions..."
          LAST_DEV_VERSION=$(curl -u ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }} https://docker.scalastaging.online/v2/hcms-fe-staging/tags/list | jq -r '.tags[]' | grep '^v' | sort -rV | head -n 1)
          echo "Last Dev Version: $LAST_DEV_VERSION"
          
          if [ -z "$LAST_DEV_VERSION" ]; then
            NEW_DEV_VERSION="v1"
          else
            DEV_VERSION_NUMBER=$(echo $LAST_DEV_VERSION | sed 's/v//')
            NEW_DEV_VERSION="v$(($DEV_VERSION_NUMBER + 1))"
          fi
          
          echo "New Dev Version: $NEW_DEV_VERSION"
          echo "dev_version=$NEW_DEV_VERSION" >> $GITHUB_ENV
          echo "::set-output name=dev_version::$NEW_DEV_VERSION"
          
      - name: Print Development Version
        run: echo "Development Version is ${{ env.dev_version }}"
        
      - name: Build Docker image
        run: docker build -t docker.scalastaging.online/hcms-fe-staging:${{ env.dev_version }} .

      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login docker.scalastaging.online -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push Docker image to registry
        run: docker push docker.scalastaging.online/hcms-fe-staging:${{ env.dev_version }}

      - name: Cleanup old Docker images
        run: |
          echo "Fetching and sorting Docker image tags..."
          TAGS=$(curl -u ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }} https://docker.scalastaging.online/v2/hcms-fe-staging/tags/list | jq -r '.tags[]' | sort -rV)
          
          echo "Keeping top 5 tags..."
          KEEP_TAGS=$(echo "$TAGS" | head -n 5)
          
          TAG_COUNT=$(echo "$TAGS" | wc -l)
          
          if [ "$TAG_COUNT" -le 5 ]; then
            echo "No old images to remove. Total images count: $TAG_COUNT"
          else
            echo "Determining tags to delete..."
            DELETE_TAGS=$(echo "$TAGS" | grep -vxFf <(echo "$KEEP_TAGS"))
            
            echo "Tags to delete:"
            echo "$DELETE_TAGS"
            
            for TAG in $DELETE_TAGS; do
              echo "Removing tag: $TAG"
              # Delete the tag (adjust the API endpoint and method as necessary)
              curl -u ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }} -X DELETE https://docker.scalastaging.online/v2/hcms-fe-staging/manifests/$TAG
            done
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_STAGING }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD_STAGING }}
          script: |
            # Login to Docker registry
             echo ${{ secrets.DOCKER_PASSWORD }} | docker login docker.scalastaging.online -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            # Remove existing container if it exists
             docker rm -f hcms-fe-staging || true
            # Run the new container
             docker run -d -it -p 8082:80 --name hcms-fe-staging docker.scalastaging.online/hcms-fe-staging:${{ needs.build-and-push.outputs.dev_version }}
            # Cleanup old Docker images locally
            TAGS=$(docker images --filter=reference='docker.scalastaging.online/hcms-fe-staging:*' --format "{{.Tag}}" | sort -rV)
            KEEP_TAGS=$(echo "$TAGS" | head -n 5)
            DELETE_TAGS=$(echo "$TAGS" | grep -vxFf <(echo "$KEEP_TAGS"))
            
            for TAG in $DELETE_TAGS; do
              echo "Removing local image: docker.scalastaging.online/hcms-fe-staging:$TAG"
              docker rmi -f docker.scalastaging.online/hcms-fe-staging:$TAG || true
            done 
  send-notification:
    name: Send Notification to Discord
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - name: Debug Notification Variables
        id: debug_variables
        run: |
          NOTIF_DEV=$(curl -u ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }} https://docker.scalastaging.online/v2/hcms-fe-staging/tags/list | jq -r '.tags[]' | grep '^v' | sort -rV | head -n 1)
          echo "notif_dev=$NOTIF_DEV"
          echo "notif_dev=$NOTIF_DEV" >> $GITHUB_ENV
          echo "::set-output name=notif_dev::$NOTIF_DEV"

      - name: Send message to Discord  
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Deployment HCMS BE Stagging"
          description: "Done Update ${{ github.repository }} ke versi ${{ env.notif_dev }}"
          color: 0xFF0000
