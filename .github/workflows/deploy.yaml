run-name: ${{ github.actor }} is deploying out ${{ github.repository }} 🚀
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      SHORT_SHA: ${{ steps.set_short_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file from secret
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          echo "$ENV_CONTENT" > .env
          cat .env  # Untuk memastikan file .env telah terbuat dengan benar

      - name: Print .env content
        run: cat .env  # Mengganti .env dengan nama file jika berbeda
        
      - name: Set SHORT_SHA environment variable
        id: set_short_sha
        run: echo "::set-output name=short_sha::${GITHUB_SHA::7}"
        
      - name: Build Docker image
        run: docker build -t docker.productscala.online/hcms-fe:${{ steps.set_short_sha.outputs.short_sha }} .

      - name: Log in to Docker Registry
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login docker.productscala.online -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push Docker image to registry
        run: docker push docker.productscala.online/hcms-fe:${{ steps.set_short_sha.outputs.short_sha }}

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            docker rm -f hcms-fe || true
            docker run -d -it -p 8080:80 --name hcms-fe docker.productscala.online/hcms-fe:${{ needs.build-and-push.outputs.SHORT_SHA }}

  send-notification:
    name: Send Notification to Discord
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - name: Send message to Discord  
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Deployment FrontEnd HCMS"
          description: "Done Update ${{ github.repository }}"
          color: 0xFF0000
